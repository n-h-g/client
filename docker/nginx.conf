# The client (Vue build), the websocket of the game and the assets, on one site:
# the client in production uses paths of this same host (general.production.json).

# the login and the registration: 10 a minute for each address (with a burst), against password guessing
limit_req_zone $binary_remote_addr zone=account:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # the containers of the compose network, resolved when used (nginx starts before the game is up)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # the game websocket (websocket.handler.path of the game service)
    location /nhg/game {
        set $game http://game:8083;
        proxy_pass $game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # the account service: only the login and the registration (the token endpoints are for the services)
    location ~ ^/api/v1/accounts/(login|register)$ {
        limit_req zone=account burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;

        set $account http://account:8086;
        proxy_pass $account;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        return 404;
    }

    # the Nitro assets (the "Nitro Assets" folder of the Nitro repository): furniture, icons, effects, gamedata
    location /nitro/ {
        alias /srv/nitro/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # the avatar assets of NHG: figures and avatar gamedata
    location /nhg-assets/ {
        alias /srv/nhg-assets/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # the bundles of the build have a hash in their name
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # the client routes (/login, /register, /sso/<ticket>, /room/<id>) are pages of the single page app
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
